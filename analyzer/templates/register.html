<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BODY FIX (REMOVE FLEX ❌) */
body{
    background:linear-gradient(135deg,#020617,#0f172a,#111827);
    color:white;
}

/* NAVBAR */
.navbar{
    width:100%;
    padding:16px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(15,23,42,0.75);
    backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(255,255,255,0.06);

    position:sticky;
    top:0;
    z-index:100;

    box-shadow:0 8px 30px rgba(0,0,0,0.25);
}

/* BACKGROUND */
body{
    background: radial-gradient(circle at top,#1e1b4b,#020617);
    color:white;
}

/* LOGO */
.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:0.5px;

    background:linear-gradient(90deg,#3b82f6,#6366f1);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* NAV LINKS */
.nav-links a{
    position:relative;
    margin-left:28px;
    text-decoration:none;
    color:#cbd5f5;
    font-weight:500;
    font-size:15px;

    transition:all 0.3s ease;
}

/* HOVER EFFECT */
.nav-links a:hover{
    color:#ffffff;
}

/* UNDERLINE ANIMATION */
.nav-links a::after{
    content:"";
    position:absolute;
    width:0%;
    height:2px;
    left:0;
    bottom:-5px;

    background:linear-gradient(90deg,#3b82f6,#6366f1);
    transition:0.3s;
}

.nav-links a:hover::after{
    width:100%;
}

/* CENTER WRAPPER (NEW FIX) */
.page-center{
    height:calc(100vh - 80px);
    display:flex;
    justify-content:center;   /* ✅ CENTER HORIZONTAL */
    align-items:center;       /* ✅ CENTER VERTICAL */
}

/* CARD */
.register-card{
    width:900px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
}

/* LEFT */
.left{
    width:40%;
    background:linear-gradient(135deg,#1e293b,#020617);
    padding:40px;
}

.left h1{
    color:#3b82f6;
}

.left h2{
    margin-top:20px;
}

.left p{
    margin-top:10px;
    color:#94a3b8;
}

/* RIGHT */
.right{
    width:60%;
    padding:40px;
    background:#0f172a;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    background:#020617;
    color:white;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#2563eb,#3b82f6);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,0.4);
}

.switch{
    margin-top:15px;
    text-align:center;
    color:#94a3b8;
}

.switch a{
    color:#3b82f6;
    text-decoration:none;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">AI Resume Analyzer</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/upload/">Analyze</a>
        <a href="/login/">Login</a> <!-- FIXED -->
    </div>
</div>

<!-- CENTER CONTENT -->
<div class="page-center">

    <div class="register-card">

        <!-- LEFT -->
        <div class="left">
            <h1>ResumeAI</h1>
            <h2>Create Account</h2>
            <p>Join to analyze resumes and improve your career opportunities.</p>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <form method="POST">
                {% csrf_token %}

                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>

                <button type="submit">Register</button>

                <p class="switch">
                    Already have account? <a href="/login/">Login</a>
                </p>
            </form>
        </div>

    </div>

</div>

</body>
</html>
